<VirtualHost *:80>
    ServerName money-paws
    DocumentRoot /var/www/html
    
    # Security headers
    Header always set X-Content-Type-Options nosniff
    Header always set X-Frame-Options DENY
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    
    # Enable compression
    LoadModule deflate_module modules/mod_deflate.so
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/plain
        AddOutputFilterByType DEFLATE text/html
        AddOutputFilterByType DEFLATE text/xml
        AddOutputFilterByType DEFLATE text/css
        AddOutputFilterByType DEFLATE application/xml
        AddOutputFilterByType DEFLATE application/xhtml+xml
        AddOutputFilterByType DEFLATE application/rss+xml
        AddOutputFilterByType DEFLATE application/javascript
        AddOutputFilterByType DEFLATE application/x-javascript
    </IfModule>
    
    # Cache static assets
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType text/css "access plus 1 month"
        ExpiresByType application/javascript "access plus 1 month"
        ExpiresByType image/png "access plus 1 month"
        ExpiresByType image/jpg "access plus 1 month"
        ExpiresByType image/jpeg "access plus 1 month"
        ExpiresByType image/gif "access plus 1 month"
        ExpiresByType image/ico "access plus 1 month"
        ExpiresByType image/icon "access plus 1 month"
        ExpiresByType text/x-icon "access plus 1 month"
        ExpiresByType image/x-icon "access plus 1 month"
        ExpiresByType application/pdf "access plus 1 month"
        ExpiresByType application/x-shockwave-flash "access plus 1 month"
    </IfModule>
    
    # Directory settings
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        
        # URL rewriting for clean URLs
        RewriteEngine On
        
        # Health check endpoint
        RewriteRule ^health-check\.php$ - [L]
        
        # API routes
        RewriteRule ^api/(.*)$ api/$1 [L,QSA]
        
        # OAuth routes
        RewriteRule ^oauth/(.*)$ oauth/$1 [L,QSA]
        
        # Admin routes
        RewriteRule ^admin/(.*)$ admin/$1 [L,QSA]
        
        # Main application routes
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^(.*)$ index.php [L,QSA]
    </Directory>
    
    # Uploads directory
    <Directory /var/www/html/uploads>
        Options -Indexes
        AllowOverride None
        Require all granted
        
        # Security: Prevent execution of PHP files in uploads
        <FilesMatch "\.php$">
            Require all denied
        </FilesMatch>
    </Directory>
    
    # Config directory protection
    <Directory /var/www/html/config>
        Require all denied
    </Directory>
    
    # Database directory protection
    <Directory /var/www/html/database>
        Require all denied
    </Directory>
    
    # Includes directory protection
    <Directory /var/www/html/includes>
        Require all denied
    </Directory>
    
    # Infrastructure directory protection
    <Directory /var/www/html/infrastructure>
        Require all denied
    </Directory>
    
    # Logs
    ErrorLog ${APACHE_LOG_DIR}/money-paws-error.log
    CustomLog ${APACHE_LOG_DIR}/money-paws-access.log combined
    LogLevel warn
</VirtualHost>
