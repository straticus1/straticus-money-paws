server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; require-trusted-types-for 'script'; trusted-types 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # HTML must be revalidated so deployments do not leave users on stale asset
  # manifests. Hashed build assets are safe to cache for a year.
  location = /index.html {
    expires -1;
    try_files $uri =404;
  }

  location ~* ^/assets/.*\.(js|css|woff2?|png|svg|webp)$ {
    expires 1y;
    try_files $uri =404;
  }

  # TypeScript and source maps are never production artifacts. Without this,
  # the SPA fallback would misleadingly answer these probes with index.html.
  location ~* \.(tsx?|jsx?|map)$ {
    return 404;
  }

  location ~ /\. {
    deny all;
  }

  # SPA routing
  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Overwrite rather than append the client-controlled X-Forwarded-For value.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1m;
    proxy_hide_header X-Powered-By;
  }
}
