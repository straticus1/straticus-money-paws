services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: paws
      POSTGRES_USER: paws
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paws -d paws"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    environment:
      DATABASE_URL: postgres://paws:${POSTGRES_PASSWORD}@postgres:5432/paws
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET (32-byte base64) in .env}
      COINBASE_API_KEY: ${COINBASE_API_KEY:-}
      COINBASE_WEBHOOK_SECRET: ${COINBASE_WEBHOOK_SECRET:-}
      NODE_ENV: production
      WEB_ORIGIN: ${WEB_ORIGIN:?set WEB_ORIGIN to the exact public site origin}
      TRUST_PROXY: "true"
      PORT: "3000"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
